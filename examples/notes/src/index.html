<!doctype html>
<html>
  <body>
    <main class="shell">
      <header class="top">
        <h1>Notes</h1>
        <p class="status">{{status}}</p>
      </header>

      <section class="row">
        <input type="text" placeholder="note name" data-bind="draftName" />
        <button class="primary" data-onclick="saveNote">Save</button>
        <button class="ghost" data-onclick="openNote">Open</button>
        <button class="ghost" data-onclick="deleteNote">Delete</button>
        <button class="ghost" data-onclick="refresh">Refresh</button>
      </section>

      <use component="CodeEditor" placeholder="Write something" aria-label="Note text" data-bind="draftText" />

      <section class="files">
        <p class="label">Saved notes</p>
        <use component="Table" aria-label="Saved notes">
          <use component="TableHeader">
            <use component="TableHeaderCell">Name</use>
            <use component="TableHeaderCell">Size</use>
          </use>
          <use component="TableRow" data-repeat="files as file">
            <use component="TableCell">{{file.name}}</use>
            <use component="TableCell">{{file.size}} bytes</use>
          </use>
        </use>
      </section>
    </main>
  </body>
</html>
