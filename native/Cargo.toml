[package]
name = "tsgpui-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reusable GPU-native host for HTML/CSS/TypeScript TSGPUI bundles"

[dependencies]
gpui = "=0.2.2"
rquickjs = "=0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "s"

# Windows: native host uses the GPUI Windows platform backend.
# Build tools (MSVC + Rust) are required ONLY to build the host, not each app.
