name: Validate hosts across platforms
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - 'packages/**'
      - 'examples/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/platform-validation.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'packages/**'
      - 'examples/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/platform-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install Linux WebView dependencies
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libssl-dev libasound2-dev libfontconfig-dev libvulkan-dev
      - name: Install JavaScript dependencies
        run: bun install
      - name: Check CLI and compiler
        run: bun run test
      - name: Type-check examples
        run: |
          bun run typecheck
          bunx tsc --noEmit -p examples/notes/tsconfig.json
      - name: Compile both example bundles
        run: |
          node packages/cli/bin/tsgpui.mjs compile --project examples/counter
          node packages/cli/bin/tsgpui.mjs compile --project examples/notes
      - name: Test native host
        run: cargo test --manifest-path native/Cargo.toml --features native-host
      - name: Build native host
        run: cargo build --manifest-path native/Cargo.toml --release --features native-host --bin tsgpui-host
      - name: Build WebView host
        run: cargo build --manifest-path native/Cargo.toml --release --no-default-features --features webview-host --bin tsgpui-webview-host
      - name: Import and build Windows sample
        if: matrix.target == 'windows-x64'
        run: |
          node packages/cli/bin/tsgpui.mjs import electron examples/electron-sample --out runner-sample --build
          node packages/cli/bin/tsgpui.mjs build --project runner-sample --host native/target/release/tsgpui-webview-host.exe
      - name: Run Windows end-to-end check
        if: matrix.target == 'windows-x64'
        run: node scripts/e2e-windows.mjs runner-sample/dist/electron-sample.exe e2e-report.json
      - name: Upload Windows end-to-end report
        if: always() && matrix.target == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-report
          path: e2e-report.json
