name: Compile TS-GPU counter to Windows EXE
# Packages the counter example with the DEPRECATED GPUI host. Rendrix-host packaging and the
# Windows GUI smoke live in platform-validation.yml.
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - 'packages/**'
      - 'examples/**'
      - 'package.json'
      - '.github/workflows/windows-app.yml'
permissions:
  contents: read
jobs:
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install build dependencies
        run: bun install
      - name: Test compiler
        run: bun run test
      - name: Type-check TypeScript example
        run: bun run typecheck
      - name: Build deprecated GPUI host
        run: node packages/cli/bin/tsgpu.mjs host build
      - name: Package counter EXE with the deprecated GPUI host
        run: node packages/cli/bin/tsgpu.mjs build --project examples/counter --renderer native
      - name: Generate EXE checksum
        shell: pwsh
        run: (Get-FileHash 'examples/counter/dist/tsgpu-counter.exe' -Algorithm SHA256).Hash | Set-Content examples/counter/dist/tsgpu-counter.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tsgpu-counter-windows-x64
          path: |
            examples/counter/dist/tsgpu-counter.exe
            examples/counter/dist/tsgpu-counter.exe.sha256
          if-no-files-found: error
