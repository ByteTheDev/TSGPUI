name: Compile Windows hosts
# Builds the deprecated GPUI host and the Rendrix host for Windows x64 and saves SHA-256
# hashes. The WebView host is gone with the WebView renderer.
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/windows-host.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/windows-host.yml'
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Test Rendrix host
        run: cargo test --manifest-path native/Cargo.toml --features rendrix --bin rendrix-host
      - name: Build Rendrix host
        run: cargo build --manifest-path native/Cargo.toml --release --no-default-features --features rendrix --bin rendrix-host
      - name: Build deprecated GPUI host
        run: cargo build --manifest-path native/Cargo.toml --release --features native-host --bin tsgpu-gpui-host
      - name: Save Rendrix SHA-256 hash
        shell: pwsh
        run: (Get-FileHash 'native/target/release/rendrix-host.exe' -Algorithm SHA256).Hash | Set-Content native/target/release/rendrix-host.exe.sha256
      - name: Save GPUI SHA-256 hash
        shell: pwsh
        run: (Get-FileHash 'native/target/release/tsgpu-gpui-host.exe' -Algorithm SHA256).Hash | Set-Content native/target/release/tsgpu-gpui-host.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rendrix-host-windows-x64
          path: |
            native/target/release/rendrix-host.exe
            native/target/release/rendrix-host.exe.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: tsgpu-gpui-host-windows-x64
          path: |
            native/target/release/tsgpu-gpui-host.exe
            native/target/release/tsgpu-gpui-host.exe.sha256
          if-no-files-found: error
