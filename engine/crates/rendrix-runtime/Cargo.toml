[package]
name = "rendrix-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rendrix application runtime: window, input, frame loop and bundle loader"

[lib]
doctest = false
name = "rendrix_runtime"

[[bin]]
name = "rendrix-runtime"
path = "src/main.rs"

[dependencies]
rendrix-core.workspace = true
rendrix-dom.workspace = true
rendrix-css.workspace = true
rendrix-gfx.workspace = true
rendrix-js.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
arboard = { version = "3", default-features = false }
