name: Build Rendrix macOS app
# Packages the counter example with the DEPRECATED legacy host. Rendrix-host packaging and the
# Windows GUI smoke live in platform-validation.yml; macOS packaged-app GUI smoke is pending
# physical verification on hosted runners.
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - 'packages/**'
      - 'examples/**'
      - 'package.json'
      - '.github/workflows/macos-app.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'packages/**'
      - 'examples/**'
      - 'package.json'
      - '.github/workflows/macos-app.yml'
permissions:
  contents: read
jobs:
  macos-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install dependencies
        run: bun install
      - name: Build and package with the deprecated legacy host
        run: |
          node packages/cli/bin/rendrix.mjs host build
          node packages/cli/bin/rendrix.mjs build --project examples/counter --renderer native
      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent examples/counter/dist/rendrix-counter.app examples/counter/dist/rendrix-counter-macos-${{ matrix.arch }}.zip
      - name: Generate SHA-256 checksum
        run: shasum -a 256 examples/counter/dist/rendrix-counter-macos-${{ matrix.arch }}.zip > examples/counter/dist/rendrix-counter-macos-${{ matrix.arch }}.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rendrix-counter-macos-${{ matrix.arch }}
          path: |
            examples/counter/dist/rendrix-counter-macos-${{ matrix.arch }}.zip
            examples/counter/dist/rendrix-counter-macos-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
