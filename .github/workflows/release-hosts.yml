name: Release prebuilt hosts
# Builds the native and WebView hosts for every supported target and attaches them, with hosts.json
# (names, sizes and SHA-256 hashes), to the GitHub release the CLI downloads from.
# Run it by pushing a tag such as v0.3.0, or manually with the tag as input.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the hosts to (for example v0.3.0)
        required: true
permissions:
  contents: write
  id-token: write
  attestations: write
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, target: win32-x64, ext: .exe}
          - {os: windows-11-arm, target: win32-arm64, ext: .exe}
          - {os: macos-14, target: darwin-arm64, ext: ''}
          - {os: ubuntu-22.04, target: linux-x64, ext: ''}
          - {os: ubuntu-24.04-arm, target: linux-arm64, ext: ''}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install Linux system libraries
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libssl-dev libasound2-dev libfontconfig-dev libvulkan-dev
      - name: Build native host
        run: cargo build --manifest-path native/Cargo.toml --release --features native-host --bin tsgpui-host
      - name: Build WebView host
        run: cargo build --manifest-path native/Cargo.toml --release --no-default-features --features webview-host --bin tsgpui-webview-host
      - name: Stage release assets
        shell: bash
        run: |
          mkdir stage
          cp "native/target/release/tsgpui-host${{ matrix.ext }}" "stage/tsgpui-host-native-${{ matrix.target }}${{ matrix.ext }}"
          cp "native/target/release/tsgpui-webview-host${{ matrix.ext }}" "stage/tsgpui-host-webview-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: stage/*
      - uses: actions/upload-artifact@v4
        with:
          name: hosts-${{ matrix.target }}
          path: stage/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: hosts-*
          path: hosts
          merge-multiple: true
      - name: Write hosts.json
        run: node packages/cli/scripts/make-host-manifest.mjs hosts "${TAG#v}"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes "Prebuilt hosts for $TAG"
          gh release upload "$TAG" hosts/* --clobber
