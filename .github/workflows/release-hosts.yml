name: Release prebuilt hosts
# Builds the Rendrix host (and the deprecated GPUI host) for every supported target and
# attaches them, with hosts.json (names, sizes and SHA-256 hashes), to the GitHub release
# the CLI downloads from. No WebView host is built: the WebView renderer is removed.
# Run it by pushing a tag such as v0.4.0, or manually with the tag as input.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the hosts to (for example v0.4.0)
        required: true
permissions:
  contents: write
  id-token: write
  attestations: write
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, target: win32-x64, ext: .exe}
          - {os: windows-11-arm, target: win32-arm64, ext: .exe}
          - {os: macos-15, target: darwin-arm64, ext: ''}
          - {os: ubuntu-22.04, target: linux-x64, ext: ''}
          - {os: ubuntu-24.04-arm, target: linux-arm64, ext: ''}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # WebKitGTK/GTK are gone with the WebView host; these are the deprecated GPUI host's
      # Linux system libraries. NOTE: hosts published for Linux are compile-verified only —
      # GUI smoke on Linux runners is pending physical verification.
      - name: Install Linux system libraries
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libssl-dev libasound2-dev libfontconfig-dev libvulkan-dev
      - name: Build Rendrix host
        run: cargo build --manifest-path native/Cargo.toml --release --no-default-features --features rendrix --bin rendrix-host
      - name: Build deprecated GPUI host
        run: cargo build --manifest-path native/Cargo.toml --release --features native-host --bin tsgpu-gpui-host
      - name: Stage release assets
        shell: bash
        run: |
          mkdir stage
          cp "native/target/release/rendrix-host${{ matrix.ext }}" "stage/rendrix-host-${{ matrix.target }}${{ matrix.ext }}"
          cp "native/target/release/tsgpu-gpui-host${{ matrix.ext }}" "stage/tsgpu-gpui-host-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: stage/*
      - uses: actions/upload-artifact@v4
        with:
          name: hosts-${{ matrix.target }}
          path: stage/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: hosts-*
          path: hosts
          merge-multiple: true
      # hosts.json v2: one rendrix-host-<target> entry per target, plus tsgpu-gpui-host-<target>
      # while the GPUI host is deprecated. make-host-manifest.mjs (packages/cli/scripts) must
      # accept the new asset pattern — Agent J's rename.
      - name: Write hosts.json
        run: node packages/cli/scripts/make-host-manifest.mjs hosts "${TAG#v}"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes "Prebuilt hosts for $TAG"
          gh release upload "$TAG" hosts/* --clobber
