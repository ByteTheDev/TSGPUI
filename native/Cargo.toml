[package]
name = "rendrix-host"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Native GPUI (deprecated) and Rendrix hosts for Rendrix bundles"

[features]
default = ["native-host"]
native-host = ["dep:base64", "dep:futures", "dep:gpui", "dep:notify-rust", "dep:rquickjs", "dep:zed-reqwest", "dep:ureq", "dep:url"]
rendrix = ["dep:winit", "dep:wgpu", "dep:taffy", "dep:cosmic-text", "dep:pollster", "dep:bytemuck", "dep:url", "dep:ureq"]

[[bin]]
name = "rendrix-legacy-host"
path = "src/main.rs"
required-features = ["native-host"]

[[bin]]
name = "rendrix-host"
path = "src/gpu_main.rs"
required-features = ["rendrix"]

[dependencies]
base64 = { version = "=0.22.1", optional = true }
anyhow = "=1.0.104"
futures = { version = "=0.3.34", optional = true }
gpui = { version = "=0.2.2", optional = true }
notify-rust = { version = "=4.18.2", optional = true }
rquickjs = { version = "=0.14.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zed-reqwest = { version = "=0.12.15-zed", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
ureq = { version = "2", optional = true }
url = { version = "2", optional = true }
sha2 = "0.10"
winit = { version = "0.30", optional = true }
wgpu = { version = "25", optional = true }
taffy = { version = "0.9", optional = true }
cosmic-text = { version = "0.14", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The Linux tray is a StatusNotifierItem (ksni) and global shortcuts use X11 key grabs. Both are
# optional at runtime: a session without a D-Bus watcher or X server reports an event instead of
# stopping the app.
ksni = { version = "=0.3.7", default-features = false, features = ["blocking", "async-io"] }
x11rb = { version = "=0.13.2", default-features = false }

# Native dialogs, clipboard and power-block support on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
rfd = "=0.15.4"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The macOS tray is an NSStatusItem and global shortcuts use a CGEventTap, both reached through
# objc2 and the platform frameworks.
[target.'cfg(target_os = "macos")'.dependencies]
dispatch = "=0.2.0"
objc2 = "=0.6.5"
objc2-app-kit = "=0.3.2"
objc2-foundation = "=0.3.2"

# Native dialogs on macOS and Linux (rfd is cross-platform).
[target.'cfg(not(target_os = "windows"))'.dependencies]
rfd = "=0.15.4"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3

# The host is compiled for the target OS and architecture. Windows builds use MSVC; macOS builds
# use the Apple toolchain provided by Xcode. End users need neither Rust nor Bun/Node to run a bundle.

# xattr 0.2.3 uses libc's ENOATTR on Linux, which libc no longer defines there. patches/xattr is
# the same release with ENODATA used on Linux. Remove this once an xattr release fixes it upstream.
[patch.crates-io]
xattr = { path = "patches/xattr" }
