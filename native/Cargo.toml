[package]
name = "tsgpui-host"
version = "0.4.0-beta.1"
edition = "2024"
license = "MIT"
description = "Native GPUI and system WebView hosts for TSGPUI bundles"

[features]
default = ["native-host"]
native-host = ["dep:base64", "dep:futures", "dep:gpui", "dep:notify-rust", "dep:rquickjs", "dep:zed-reqwest", "dep:ureq", "dep:url"]
webview-host = ["dep:gtk", "dep:tao", "dep:wry", "dep:ureq", "dep:url"]

[[bin]]
name = "tsgpui-host"
path = "src/main.rs"
required-features = ["native-host"]

[[bin]]
name = "tsgpui-webview-host"
path = "src/webview_main.rs"
required-features = ["webview-host"]

[dependencies]
base64 = { version = "=0.22.1", optional = true }
anyhow = "=1.0.104"
futures = { version = "=0.3.34", optional = true }
gpui = { version = "=0.2.2", optional = true }
notify-rust = { version = "=4.18.2", optional = true }
rquickjs = { version = "=0.14.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zed-reqwest = { version = "=0.12.15-zed", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
tao = { version = "=0.37.1", optional = true }
wry = { version = "=0.57.0", optional = true }
ureq = { version = "2", optional = true }
url = { version = "2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", optional = true }

# Native dialogs and clipboard for the WebView host on Windows (used only by webview_bridge.rs).
[target.'cfg(target_os = "windows")'.dependencies]
rfd = "=0.15.4"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Power"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "s"

# The host is compiled for the target OS and architecture. Windows builds use MSVC; macOS builds
# use the Apple toolchain provided by Xcode. End users need neither Rust nor Bun/Node to run a bundle.
