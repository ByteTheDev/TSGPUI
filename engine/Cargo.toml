[workspace]
resolver = "2"
members = [
    "crates/rendrix-css",
    "crates/rendrix-dom",
    "crates/rendrix-layout",
    "crates/rendrix-gfx",
    "crates/rendrix-core",
    "crates/rendrix-js",
    "crates/rendrix-runtime",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
taffy = { version = "0.9", default-features = false, features = ["std", "flexbox", "grid", "block_layout", "content_size", "taffy_tree"] }
cosmic-text = "0.14"
wgpu = "25"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
rquickjs = { version = "=0.14.0", features = ["loader", "futures"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rendrix-css = { path = "crates/rendrix-css" }
rendrix-dom = { path = "crates/rendrix-dom" }
rendrix-layout = { path = "crates/rendrix-layout" }
rendrix-gfx = { path = "crates/rendrix-gfx" }
rendrix-core = { path = "crates/rendrix-core" }
rendrix-js = { path = "crates/rendrix-js" }

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3

[profile.dev]
opt-level = 1
